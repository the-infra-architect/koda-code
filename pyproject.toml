[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "koda-code"
version = "0.4.0"
description = "An intent-first workflow for proportionate AI-assisted software engineering."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "the-infra-architect" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.8.6,<2",
  "build>=1.3.0,<2",
  "coverage[toml]>=7.10.7,<8",
  "mypy>=1.18.2,<2",
  "pip-audit>=2.9.0,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.13.2,<1",
]

[project.scripts]
koda = "koda_code.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["koda_code"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
