name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m pytest --cov=koda_code --cov-report=term-missing --cov-report=xml
      - if: matrix.python-version == '3.11'
        run: python -m ruff format --check src tests
      - if: matrix.python-version == '3.11'
        run: python -m ruff check src tests
      - if: matrix.python-version == '3.11'
        run: python -m mypy src
      - if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .vscode/koda-tools/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .vscode/koda-tools
      - run: npm run check
        working-directory: .vscode/koda-tools
      - run: npm run package
        working-directory: .vscode/koda-tools
      - uses: actions/upload-artifact@v6
        with:
          name: koda-code-vscode
          path: .vscode/koda-tools/dist/*.vsix

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: python -m bandit -q -ll -r src
      - run: python -m koda_code.security
      - run: python -m pip_audit

  sonar:
    if: vars.SONAR_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
